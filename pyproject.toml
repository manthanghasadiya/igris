[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igris"
version = "0.2.3"
description = "Security scanner for AI agent workflows - find vulnerabilities in LangChain, CrewAI, and other agent frameworks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Manthan Ghasadiya", email = "manthan27ghasadiya@gmail.com" }
]
keywords = ["security", "ai", "agents", "langchain", "crewai", "pentesting", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
ai = [
    "openai>=1.0.0",
    "groq>=0.4.0",
]

[project.scripts]
igris = "igris.cli:app"

[project.urls]
Homepage = "https://github.com/manthanghasadiya/igris"
Repository = "https://github.com/manthanghasadiya/igris"
Issues = "https://github.com/manthanghasadiya/igris/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
